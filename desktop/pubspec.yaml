name: titofy
description: "Titofy 1.0 — Reproductor multimedia con IA local para transcripción y karaoke sincronizado."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── Reproductor multimedia (audio con libmpv) ──────────────────────
  media_kit: ^1.1.11
  media_kit_libs_linux: ^1.0.7          # libs nativas Linux (libmpv)
  media_kit_libs_windows_audio: ^1.0.7  # libs nativas Windows (libmpv audio)

  # ── Selector de archivos y carpetas ────────────────────────────────────────
  file_picker: ^10.1.9

  # ── HTTP client para API local (localhost:8642) ────────────────────────────
  http: ^1.4.0

  # ── Base de datos local (biblioteca de música/video) ──────────────────────
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.30
  drift: ^2.26.1

  # ── Config y rutas ────────────────────────────────────────────────────────
  yaml: ^3.1.3
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Control de ventana nativa ─────────────────────────────────────────────
  window_manager: ^0.4.3

  # ── State management ──────────────────────────────────────────────────────
  provider: ^6.1.5

  # ── Metadatos de audio (carátulas ID3, título, artista) ───────────────────
  metadata_god: ^1.1.0          # Pure Dart, sin dependencias nativas

  # ── Tipografía (Outfit, JetBrains Mono via Google Fonts) ─────────────────
  google_fonts: ^6.2.1

  # ── Íconos Material extendidos ────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  # ── Assets ────────────────────────────────────────────────────────────────
  assets:
    - assets/images/

dependency_overrides:
  flutter_rust_bridge: 2.11.1
