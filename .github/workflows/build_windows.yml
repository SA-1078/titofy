name: Compilar Titofy para Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, '2.3', '2.*' ]
    tags: [ 'v*' ]

jobs:
  build-windows:
    name: Build Titofy Windows Installer
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd desktop
          flutter pub get

      - name: Compilar Release de Flutter para Windows
        run: |
          cd desktop
          flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar Backend FastAPI a Ejecutable Windows (api_server.exe)
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          cd backend
          python -m PyInstaller --noconfirm --onefile --console --name api_server `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import faster_whisper `
            --hidden-import music_detector `
            --paths . `
            --collect-all lyrics `
            --collect-all postprocess `
            --collect-all whisper_engine `
            --collect-all server `
            --collect-all cuda `
            --collect-all windows `
            --collect-all youtube `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all nvidia.cublas `
            --collect-all nvidia.cudnn `
            --add-data "config.yaml;." `
            api_server.py
          if (!(Test-Path "dist\api_server.exe")) {
            throw "Error critico: PyInstaller no genero dist\api_server.exe"
          }
          New-Item -ItemType Directory -Force -Path ..\desktop\build\windows\x64\runner\Release\backend | Out-Null
          Copy-Item dist\api_server.exe -Destination ..\desktop\build\windows\x64\runner\Release\backend\ -Force
          Copy-Item config.yaml -Destination ..\desktop\build\windows\x64\runner\Release\backend\ -Force

      - name: Incluir FFmpeg para análisis acústico local
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $target = "desktop\build\windows\x64\runner\Release\backend\bin"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $ffmpeg -Destination "$target\ffmpeg.exe" -Force
          if (!(Test-Path "$target\ffmpeg.exe")) {
            throw "Error critico: no se pudo empaquetar ffmpeg.exe"
          }

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador Titofy-Setup-v1.0.${{ github.run_number }}.exe
        run: |
          $ver = "1.0.${{ github.run_number }}"
          $infoFile = "INSTALADORES\windows\info_instalacion.txt"
          if (Test-Path $infoFile) {
            (Get-Content $infoFile -Raw -Encoding UTF8) -replace 'BIENVENIDO A TITOFY DESKTOP( v[\d\.]*)?', "BIENVENIDO A TITOFY DESKTOP v$ver" | Set-Content $infoFile -Encoding UTF8
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$ver" /DOutputBaseFilename="Titofy-Setup-v$ver" INSTALADORES\windows\titofy_setup.iss

      - name: Subir Instalador como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Titofy-Setup-v1.0.${{ github.run_number }}
          path: INSTALADORES/windows/Titofy-Setup-v1.0.${{ github.run_number }}.exe
          if-no-files-found: error
