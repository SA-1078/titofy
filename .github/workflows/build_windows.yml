name: Compilar Titofy para Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, '2.3', '2.*' ]
    tags: [ 'v*' ]

jobs:
  build-windows:
    name: Build Titofy Windows Installer
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd desktop
          flutter pub get

      - name: Compilar Release de Flutter para Windows
        run: |
          cd desktop
          flutter build windows --release

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador Titofy-Setup-v1.0.0.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" INSTALADORES\windows\titofy_setup.iss

      - name: Subir Instalador como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Titofy-Setup-v1.0.0
          path: INSTALADORES/windows/Titofy-Setup-v1.0.0.exe
          if-no-files-found: error
