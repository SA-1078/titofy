name: Compilar Titofy para Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, '2.3', '2.*' ]
    tags: [ 'v*' ]

jobs:
  build-windows:
    name: Build Titofy Windows Installer
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd desktop
          flutter pub get

      - name: Compilar Release de Flutter para Windows
        run: |
          cd desktop
          flutter build windows --release

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar Backend FastAPI a Ejecutable Windows (api_server.exe)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" requests mutagen rapidfuzz pyyaml pydantic pyinstaller
          cd backend
          python -m PyInstaller --noconfirm --onefile --console --name api_server --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on --collect-all lyrics api_server.py
          Copy-Item dist\api_server.exe -Destination .

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador Titofy-Setup-v1.0.0.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" INSTALADORES\windows\titofy_setup.iss

      - name: Subir Instalador como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Titofy-Setup-v1.0.0
          path: INSTALADORES/windows/Titofy-Setup-v1.0.0.exe
          if-no-files-found: error
