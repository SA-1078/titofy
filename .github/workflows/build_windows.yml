name: Compilar Titofy para Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, '2.3', '2.*' ]
    tags: [ 'v*' ]

jobs:
  build-windows:
    name: Build Titofy Windows Installer
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd desktop
          flutter pub get

      - name: Compilar Release de Flutter para Windows
        run: |
          cd desktop
          flutter build windows --release

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar Backend FastAPI a Ejecutable Windows (api_server.exe)
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" requests mutagen rapidfuzz pyyaml pydantic pyinstaller faster-whisper huggingface-hub
          cd backend
          python -m PyInstaller --noconfirm --onefile --console --name api_server `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import faster_whisper `
            --collect-all lyrics `
            --collect-all postprocess `
            --collect-all whisper_engine `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --add-data "config.yaml;." `
            api_server.py
          if (!(Test-Path "dist\api_server.exe")) {
            throw "Error critico: PyInstaller no genero dist\api_server.exe"
          }
          New-Item -ItemType Directory -Force -Path ..\desktop\build\windows\x64\runner\Release\backend | Out-Null
          Copy-Item dist\api_server.exe -Destination ..\desktop\build\windows\x64\runner\Release\backend\ -Force
          Copy-Item config.yaml -Destination ..\desktop\build\windows\x64\runner\Release\backend\ -Force

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador Titofy-Setup-v1.0.0.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" INSTALADORES\windows\titofy_setup.iss

      - name: Subir Instalador como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Titofy-Setup-v1.0.0
          path: INSTALADORES/windows/Titofy-Setup-v1.0.0.exe
          if-no-files-found: error
